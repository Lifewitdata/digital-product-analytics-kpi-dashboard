name: verify

# Every number published in this repo is recomputed here, on two Python
# versions, from the committed event CSV: the SQL layers, the pandas rebuild,
# the 9-file Tableau data pack, the contents of the .twbx, and the stored
# outputs of the notebook.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the standalone data quality checks
        run: python python/data_quality_checks.py

      - name: Recompute and cross-check every published figure
        run: python verify_analysis.py
